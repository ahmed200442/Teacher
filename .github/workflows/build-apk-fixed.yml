name: Build Android APK Fixed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK with low parallelism
        run: |
          gradle assembleDebug --no-daemon --max-workers=1 --stacktrace --console=plain

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-v1.1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
