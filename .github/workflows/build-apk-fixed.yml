name: Build Android APK Fixed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix two-digit exam score auto-next
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/ahmed/teacher/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          pattern = r'    private void setAutoNext\(EditText current,EditText next,int max\)\{.*?\n    private boolean hasWeekData'
          replacement = '''    private void setAutoNext(EditText current,EditText next,int max){
              current.setOnEditorActionListener((v,action,event)->{
                  if(action==EditorInfo.IME_ACTION_NEXT){
                      if(next!=null){next.requestFocus();next.selectAll();}
                      else current.clearFocus();
                      return true;
                  }
                  return false;
              });
              current.addTextChangedListener(new TextWatcher(){
                  boolean scheduled=false;
                  public void beforeTextChanged(CharSequence s,int a,int b,int c){}
                  public void onTextChanged(CharSequence s,int a,int b,int c){
                      if(scheduled||next==null||s.length()==0)return;
                      int value=num(current,max);
                      boolean complete = max<=9 ? value>=max : (s.length()>=2 && value>=10);
                      if(!complete)return;
                      scheduled=true;
                      handler.postDelayed(()->{
                          scheduled=false;
                          if(current.hasFocus()&&next!=null){next.requestFocus();next.selectAll();}
                      },500);
                  }
                  public void afterTextChanged(Editable e){}
              });
          }
          private boolean hasWeekData'''
          ns, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('setAutoNext method was not found')
          p.write_text(ns, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/com/ahmed/teacher/MainActivity.java; then
            git add app/src/main/java/com/ahmed/teacher/MainActivity.java
            git commit -m "Fix two-digit exam score input"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK with low parallelism
        run: |
          gradle assembleDebug --no-daemon --max-workers=1 --stacktrace --console=plain

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-v1.1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
