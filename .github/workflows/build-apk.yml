name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and update teacher source
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          path=Path("app/src/main/java/com/ahmed/teacher/MainActivity.java")
          text=path.read_text(encoding="utf-8") if path.exists() else ""

          if len(text)<1000 or ("public class MainActivity {" in text and "private void home" not in text):
              subprocess.run(["git","checkout","55b814873999c9ed18121712cf3a07fed295805e","--",str(path)],check=True)
              text=path.read_text(encoding="utf-8")

          marker='private final String[] weeks='
          p=text.find(marker)
          end=text.find(';',p)
          if p<0 or end<0: raise SystemExit("weeks declaration not found")

          dates='''
    // WEEK_DATES_2026: official school-year start 12/09/2026, one week apart
    private final String[] weekDates={"12/09/2026","19/09/2026","26/09/2026","03/10/2026","10/10/2026","17/10/2026","24/10/2026","31/10/2026","07/11/2026","14/11/2026","21/11/2026","28/11/2026","05/12/2026","12/12/2026","19/12/2026","26/12/2026","02/01/2027","09/01/2027"};
'''
          if "WEEK_DATES_2026" not in text:
              text=text[:end+1]+dates+text[end+1:]

          # Replace the weekly helper block so every week shows all seven weekday/date pairs.
          start=text.find('private int weekIndex()')
          assess=text.find('private void assessment()')
          if start<0 or assess<0 or start>assess:
              raise SystemExit("weekly helper block not found")
          helpers='''private int weekIndex(){for(int i=0;i<weeks.length;i++)if(weeks[i].equals(week))return i;return 0;}
    private String weekDate(){int i=weekIndex();return i<weekDates.length?weekDates[i]:"";}
    private String weekTitle(){return week+" • "+weekDate();}
    private String weekSchedule(){
        int i=weekIndex();
        if(i<0||i>=weekDates.length)return "";
        try{
            java.text.SimpleDateFormat in=new java.text.SimpleDateFormat("dd/MM/yyyy",java.util.Locale.US);
            java.util.Date d=in.parse(weekDates[i]);
            java.util.Calendar c=java.util.Calendar.getInstance(); c.setTime(d);
            String[] days={"السبت","الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"};
            StringBuilder s=new StringBuilder("📅 ");
            for(int j=0;j<7;j++){
                if(j>0)s.append("  •  ");
                s.append(days[j]).append(" ").append(in.format(c.getTime()));
                c.add(java.util.Calendar.DAY_OF_MONTH,1);
            }
            return s.toString();
        }catch(Exception e){return "📅 "+weekDate();}
    }
    private void goPreviousWeek(){int i=weekIndex();if(i>0){week=weeks[i-1];assessment();}else Toast.makeText(this,"أنت بالفعل في الأسبوع الأول",Toast.LENGTH_SHORT).show();}
    private void goNextWeek(){int i=weekIndex();if(i<weeks.length-1){week=weeks[i+1];assessment();}else Toast.makeText(this,"هذا آخر أسبوع في القائمة",Toast.LENGTH_SHORT).show();}
    '''
          text=text[:start]+helpers+text[assess:]

          # Replace the current weekly header, regardless of which earlier weekly patch is present.
          header_start=text.find('private void assessment()')
          header_marker='root.addView(tv("المجموع /25 تلقائي",15));'
          hm=text.find(header_marker,header_start)
          if header_start<0 or hm<0: raise SystemExit("assessment header not found")
          header_end=hm+len(header_marker)
          header='''private void assessment(){
        base("الصف "+grade+" - الفصل "+cls);
        root.addView(tv("التقييم الأسبوعي",20));
        root.addView(tv("📌 "+weekTitle(),17));
        TextView schedule=tv(weekSchedule(),14);
        schedule.setGravity(Gravity.RIGHT);
        schedule.setTextColor(Color.rgb(70,90,125));
        root.addView(schedule);
        root.addView(tv("المجموع /25 تلقائي",15));
        Spinner weekSpinner=new Spinner(this);
        weekSpinner.setAdapter(new ArrayAdapter<String>(this,android.R.layout.simple_spinner_dropdown_item,weeks));
        weekSpinner.setSelection(weekIndex());
        weekSpinner.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener(){
            public void onNothingSelected(android.widget.AdapterView<?> p){}
            public void onItemSelected(android.widget.AdapterView<?> p,View v,int pos,long id){if(!weeks[pos].equals(week)){week=weeks[pos];assessment();}}
        });
        root.addView(weekSpinner);
        LinearLayout weekNav=new LinearLayout(this);
        weekNav.setOrientation(LinearLayout.HORIZONTAL);
        weekNav.setGravity(Gravity.CENTER);
        Button prev=btn("⬅ الأسبوع السابق",v->goPreviousWeek());
        Button next=btn("الأسبوع التالي ➡",v->goNextWeek());
        prev.setLayoutParams(new LinearLayout.LayoutParams(0,dp(52),1));
        next.setLayoutParams(new LinearLayout.LayoutParams(0,dp(52),1));
        weekNav.addView(prev);weekNav.addView(next);root.addView(weekNav);'''
          text=text[:header_start]+header+text[header_end:]

          # Locking a week automatically moves to the next week.
          oldlock='setWeekLocked(true);Toast.makeText(this,"تم قفل "+week+" بتاريخ "+weekDate(),Toast.LENGTH_SHORT).show();goNextWeek();'
          if oldlock not in text:
              oldlock2='setWeekLocked(true);assessment();Toast.makeText(this,"تم قفل "+week,Toast.LENGTH_SHORT).show();'
              if oldlock2 in text:
                  text=text.replace(oldlock2,'setWeekLocked(true);Toast.makeText(this,"تم قفل "+week+" بتاريخ "+weekDate(),Toast.LENGTH_SHORT).show();goNextWeek();',1)

          path.write_text(text,encoding="utf-8")

          if subprocess.run(["git","diff","--quiet","--",str(path)]).returncode!=0:
              subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
              subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
              subprocess.run(["git","add",str(path)],check=True)
              subprocess.run(["git","commit","-m","Show weekday names and dates for every assessment week [skip ci]"],check=True)
              subprocess.run(["git","push","origin","HEAD:main"],check=True)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
