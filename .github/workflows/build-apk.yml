name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply current Teacher source patches
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          path=Path("app/src/main/java/com/ahmed/teacher/MainActivity.java")
          text=path.read_text(encoding="utf-8") if path.exists() else ""
          if len(text)<1000 or ("public class MainActivity {" in text and "private void home" not in text):
              subprocess.run(["git","checkout","55b814873999c9ed18121712cf3a07fed295805e","--",str(path)],check=True)
          subprocess.run(["python","scripts/custom_week_dates.py"],check=True)
          if subprocess.run(["git","diff","--quiet","--",str(path)]).returncode!=0:
              subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
              subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
              subprocess.run(["git","add",str(path)],check=True)
              subprocess.run(["git","commit","-m","Add per-class per-week assessment dates [skip ci]"],check=True)
              subprocess.run(["git","push","origin","HEAD:main"],check=True)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
