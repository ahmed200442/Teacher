name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and update teacher source
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          path=Path("app/src/main/java/com/ahmed/teacher/MainActivity.java")
          text=path.read_text(encoding="utf-8") if path.exists() else ""

          # Restore the last known-good version if the earlier placeholder overwrite is present.
          if len(text)<1000 or "public class MainActivity {" in text and "private void home" not in text:
              subprocess.run(["git","checkout","55b814873999c9ed18121712cf3a07fed295805e","--",str(path)],check=True)
              text=path.read_text(encoding="utf-8")

          if "WEEK_DATES_2026" not in text:
              dates='''\n    // WEEK_DATES_2026: official school-year start 12/09/2026, one week apart\n    private final String[] weekDates={"12/09/2026","19/09/2026","26/09/2026","03/10/2026","10/10/2026","17/10/2026","24/10/2026","31/10/2026","07/11/2026","14/11/2026","21/11/2026","28/11/2026","05/12/2026","12/12/2026","19/12/2026","26/12/2026","02/01/2027","09/01/2027"};\n'''
              text=re.sub(r'(private final String\\[\\] weeks=.*?;\\n)',lambda m:m.group(1)+dates,text,count=1,flags=re.S)

              helpers='''\n    private int weekIndex(){for(int i=0;i<weeks.length;i++)if(weeks[i].equals(week))return i;return 0;}\n    private String weekDate(){int i=weekIndex();return i<weekDates.length?weekDates[i]:"";}\n    private String weekTitle(){return week+" • "+weekDate();}\n    private void goPreviousWeek(){int i=weekIndex();if(i>0){week=weeks[i-1];assessment();}else Toast.makeText(this,"أنت بالفعل في الأسبوع الأول",Toast.LENGTH_SHORT).show();}\n    private void goNextWeek(){int i=weekIndex();if(i<weeks.length-1){week=weeks[i+1];assessment();}else Toast.makeText(this,"هذا آخر أسبوع في القائمة",Toast.LENGTH_SHORT).show();}\n'''
              text=re.sub(r'(\\n\\s*private void assessment\\s*\\(\\)\\s*\\{)',helpers+r'\1',text,count=1)

              header='''\n        base("الصف "+grade+" - الفصل "+cls);\n        root.addView(tv("التقييم الأسبوعي",20));\n        root.addView(tv("📅 "+weekTitle(),17));\n        root.addView(tv("المجموع /25 تلقائي",15));\n        Spinner weekSpinner=new Spinner(this);\n        weekSpinner.setAdapter(new ArrayAdapter<String>(this,android.R.layout.simple_spinner_dropdown_item,weeks));\n        weekSpinner.setSelection(weekIndex());\n        weekSpinner.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener(){\n            public void onNothingSelected(android.widget.AdapterView<?> p){}\n            public void onItemSelected(android.widget.AdapterView<?> p,View v,int pos,long id){if(!weeks[pos].equals(week)){week=weeks[pos];assessment();}}\n        });\n        root.addView(weekSpinner);\n        LinearLayout weekNav=new LinearLayout(this);\n        weekNav.setOrientation(LinearLayout.HORIZONTAL);\n        weekNav.setGravity(Gravity.CENTER);\n        Button prev=btn("⬅ الأسبوع السابق",v->goPreviousWeek());\n        Button next=btn("الأسبوع التالي ➡",v->goNextWeek());\n        prev.setLayoutParams(new LinearLayout.LayoutParams(0,dp(52),1));\n        next.setLayoutParams(new LinearLayout.LayoutParams(0,dp(52),1));\n        weekNav.addView(prev);weekNav.addView(next);root.addView(weekNav);\n        TextView auto=tv("💾 الحفظ التلقائي يعمل مع كل درجة",13);auto.setTextColor(Color.rgb(35,135,80));root.addView(auto);\n'''
              pattern=r'(?s)(private void assessment\\s*\\(\\)\\s*\\{).*?TextView auto=tv\("💾 الحفظ التلقائي يعمل مع كل درجة",13\);auto\.setTextColor\(Color\.rgb\(35,135,80\)\);root\.addView\(auto\);'
              text,n=re.subn(pattern,lambda m:m.group(1)+header,text,count=1)
              if n!=1: raise SystemExit("assessment header not found")

              lock='''\n    private void confirmLock(){new AlertDialog.Builder(this).setTitle("🔒 قفل التقييم الأسبوعي").setMessage("بعد القفل لن تستطيع تعديل درجات هذا الأسبوع حتى تختار فتح التقييم مرة أخرى. هل تريد القفل؟").setNegativeButton("إلغاء",null).setPositiveButton("قفل",(d,w)->{setWeekLocked(true);Toast.makeText(this,"تم قفل "+week+" بتاريخ "+weekDate(),Toast.LENGTH_SHORT).show();goNextWeek();}).show();}\n'''
              pattern=r'(?s)\s*private void confirmLock\s*\(\)\s*\{.*?\n\s*\}\s*\n\s*private void confirmUnlock'
              text,n=re.subn(pattern,lock+'    private void confirmUnlock',text,count=1)
              if n!=1: raise SystemExit("confirmLock block not found")

              path.write_text(text,encoding="utf-8")

          if subprocess.run(["git","diff","--quiet","--",str(path)]).returncode!=0:
              subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
              subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
              subprocess.run(["git","add",str(path)],check=True)
              subprocess.run(["git","commit","-m","Add weekly dates and automatic next-week navigation [skip ci]"],check=True)
              subprocess.run(["git","push","origin","HEAD:main"],check=True)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
